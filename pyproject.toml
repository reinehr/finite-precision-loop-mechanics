[project]
name = "finite-precision-loop-mechanics"
version = "0.1.0"
description = "Mechanism-first exploration of finite-precision physics: loop traps, residues, and numerical evidence."
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long – handled by formatter where needed
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]  # allow print() in scripts
