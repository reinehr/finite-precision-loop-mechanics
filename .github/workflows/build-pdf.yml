name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "latex/**"
      - "figures/**"
  pull_request:
    paths:
      - "latex/**"
      - "figures/**"
  workflow_dispatch:

jobs:
  build:
    name: Compile LaTeX PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-science
      - name: Compile PDFs (two passes for references)
        working-directory: latex
        run: |
          pdflatex -interaction=nonstopmode preprint.tex
          pdflatex -interaction=nonstopmode preprint.tex
          pdflatex -interaction=nonstopmode theory_note.tex
          pdflatex -interaction=nonstopmode theory_note.tex
      - name: Upload PDF artefacts
        uses: actions/upload-artifact@v4
        with:
          name: finite-precision-loop-mechanics-pdfs
          path: |
            latex/preprint.pdf
            latex/theory_note.pdf
          retention-days: 90
